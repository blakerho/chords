<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, height=282, initial-scale=1, user-scalable=no">
<title>chords</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="inst" id="instBtn" aria-label="instrument">guitar</button>
    <span class="brand">chords</span>
    <button class="theme" id="themeBtn" aria-label="theme">☾</button>
  </header>

  <nav id="pickers">
    <div class="picker" id="rootPicker" data-sel="root">
      <button class="arrow" data-dir="-1" aria-label="previous key">‹</button>
      <span class="val" id="rootVal">C</span>
      <button class="arrow" data-dir="1" aria-label="next key">›</button>
    </div>
    <div class="picker" id="qualPicker" data-sel="qual">
      <button class="arrow" data-dir="-1" aria-label="previous variation">‹</button>
      <span class="val" id="qualVal">major</span>
      <button class="arrow" data-dir="1" aria-label="next variation">›</button>
    </div>
  </nav>

  <main id="stage">
    <canvas id="diagram" width="240" height="128"></canvas>
  </main>

  <footer id="voicing" data-sel="voice">
    <button class="arrow" data-dir="-1" aria-label="previous position">‹</button>
    <div class="vinfo">
      <span id="vName">open</span>
      <span id="vCount">01 / 05</span>
    </div>
    <button class="arrow" data-dir="1" aria-label="next position">›</button>
  </footer>
  <div id="notesLine"></div>
</div>
<script src="js/theory.js"></script>
<script src="js/guitar.js"></script>
<script src="js/piano.js"></script>
<script src="js/app.js"></script>
</body>
</html>
